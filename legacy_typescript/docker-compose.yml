services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinic_sync
      POSTGRES_USER: clinic_sync
      POSTGRES_PASSWORD: clinic_sync_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_sync -d clinic_sync"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - clinic-sync-postgres:/var/lib/postgresql/data

volumes:
  clinic-sync-postgres:
